name: Deploy to Cloudflare Pages

# OPTIONAL CI/CD deploy. Not needed if you connect the repo via the Cloudflare
# Pages dashboard ("Connect to Git"), which builds on every push automatically.
#
# This workflow is set to MANUAL ONLY (workflow_dispatch) so it never auto-runs
# or shows a failing check. To enable push-triggered CI deploys instead:
#   1. Add an `on: push: branches: [main]` trigger below.
#   2. Add repo secrets (Settings → Secrets and variables → Actions):
#        CLOUDFLARE_API_TOKEN   – token with "Cloudflare Pages: Edit"
#        CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
#   3. Ensure the --project-name below matches your Pages project.

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Change the project name to match your Cloudflare Pages project.
          command: pages deploy . --project-name=jjg-portfolio --commit-dirty=true
