<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 // Signal Lost — John Jacob P. Gonzales</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#07090D; --text:#E6EAF2; --muted:#707B8F; --cyan:#00D9FF; --rule:#1C2533; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',-apple-system,sans-serif;
    display:grid; place-items:center; text-align:center; padding:24px;
    background-image:
      linear-gradient(to right, rgba(0,217,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,217,255,0.035) 1px, transparent 1px);
    background-size:64px 64px;
  }
  .code { font-family:'Courier New',monospace; font-size:clamp(72px,18vw,160px); font-weight:700; color:var(--cyan); letter-spacing:-2px; line-height:1; text-shadow:0 0 40px rgba(0,217,255,0.25); }
  .tag { font-family:'Courier New',monospace; font-size:13px; letter-spacing:0.3em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
  h1 { font-size:clamp(20px,4vw,30px); font-weight:600; margin:0 0 14px; text-transform:uppercase; }
  p { color:var(--muted); max-width:420px; margin:0 auto 32px; line-height:1.6; }
  a.home {
    font-family:'Courier New',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--cyan); text-decoration:none; border:1px solid var(--cyan); padding:13px 24px;
    transition:background .2s;
  }
  a.home:hover { background:rgba(0,217,255,0.1); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <div class="tag">// Signal Lost</div>
    <h1>Off the rails</h1>
    <p>This route doesn't exist on the line. Let's get you back to the main track.</p>
    <a class="home" href="/">← Return to station</a>
  </div>
</body>
</html>
