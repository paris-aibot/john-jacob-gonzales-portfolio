<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="John Jacob P. Gonzales — T&amp;C Engineer, MRT-7">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00D9FF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07090D"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- corner brackets -->
  <path d="M64 96 V64 H96" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.7"/>
  <path d="M1136 534 V566 H1104" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.7"/>

  <text x="80" y="150" font-family="'JetBrains Mono',monospace" font-size="22" letter-spacing="6"
