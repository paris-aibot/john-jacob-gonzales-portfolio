  <text x="76" y="320" font-family="'Chakra Petch','Segoe UI',sans-serif" font-size="118" font-weight="600"
        fill="#E6EAF2" letter-spacing="-2">JOHN JACOB</text>
  <text x="76" y="430" font-family="'Chakra Petch','Segoe UI',sans-serif" font-size="118" font-weight="500"
        font-style="italic" fill="#00D9FF" letter-spacing="-2">P. GONZALES</text>

  <text x="80" y="540" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="30"
        fill="#A1ACBD">Testing &amp; Commissioning Engineer · Train Operator · Safety Officer — MRT-7</text>

  <circle cx="1112" cy="118" r="7" fill="#2BD37B"/>
  <text x="1092" y="124" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="20"
        letter-spacing="3" fill="#2BD37B">AVAILABLE</text>
</svg>
